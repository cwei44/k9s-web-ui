# Install first with --mode standalone --listen 127.0.0.1:19090.
# Put these directives in the intended Apache 2.4.47+ server/virtual host.
# Requires proxy_module, proxy_http_module, alias_module and authz_core_module.
# Place before any catch-all ProxyPass. The backend enforces HTTP Basic login.
ProxyPass "/k9s/" "http://127.0.0.1:19090/k9s/" upgrade=websocket timeout=90
ProxyPassReverse "/k9s/" "http://127.0.0.1:19090/k9s/"
RedirectMatch 302 "^/k9s$" "/k9s/"
<Location "/k9s/">
    ProxyPreserveHost On
    Require all granted
</Location>
